[metadata]
name = microstage-app
version = 0.1.0
description = MicroStage microscope controller application
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files =
    LICENSE
    microstage_app/fonts/DejaVuSans.LICENSE

[options]
packages = find:
install_requires =
    PySide6>=6.7
    pyserial>=3.5
    numpy>=1.24
    opencv-python>=4.9
    tifffile>=2024.2.12
    pyyaml>=6.0
    loguru>=0.7
    scipy>=1.11
    ome-types>=0.5
    Pillow>=11.0
    psutil>=5.9
python_requires = >=3.10
include_package_data = True

[options.packages.find]
include = microstage_app*

[options.package_data]
microstage_app =
    fonts/DejaVuSans.ttf
    fonts/DejaVuSans.LICENSE
